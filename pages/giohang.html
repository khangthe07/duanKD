    <!-- ============================= -->
    <!-- NỘI DUNG -->
    <!-- ============================= -->

    <main class="container">

      <h1>Giỏ hàng</h1>

      <!-- Số lượng sản phẩm -->

      <p id="soLuongGioHang">
        Giỏ hàng đang trống
      </p>


      <!-- Danh sách sản phẩm -->

      <div id="danhSachGioHang">
        <!-- JavaScript sẽ hiển thị tại đây -->
      </div>


      <!-- Tổng tiền -->

      <div
        id="tongTienGioHang"
        style="
          margin-top: 30px;
          padding: 20px;
          background: white;
          border-radius: 10px;
          font-size: 22px;
          font-weight: bold;
        "
      >
        Tổng tiền: 0 VNĐ
      </div>


      <!-- Nút thao tác -->

      <div
        style="
          margin-top: 20px;
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
        "
      >

        <a
          href="sanpham.html"
          class="product-button"
        >
          ← Tiếp tục mua hàng
        </a>


        <button
          id="btnXoaTatCa"
          type="button"
        >
          Xóa tất cả
        </button>


        <button
          id="btnDatHang"
          type="button"
        >
          Tiến hành đặt hàng
        </button>

      </div>

    </main>
