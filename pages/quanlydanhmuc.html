<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
      }

      header {
        background: #212529;
        color: white;
        padding: 20px;
        text-align: center;
      }

      .container {
        width: 90%;
        max-width: 1000px;
        margin: 30px auto;
      }

      .box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      textarea {
        height: 80px;
        resize: vertical;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 5px;
      }

      .btn-save {
        background: #198754;
        color: white;
      }

      .btn-reset {
        background: #6c757d;
        color: white;
      }

      .btn-edit {
        background: #ffc107;
        color: black;
      }

      .btn-delete {
        background: #dc3545;
        color: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }

      th {
        background: #212529;
        color: white;
      }

      .tim-kiem {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Quản lý danh mục sản phẩm</h1>
    </header>

    <div class="container">
      <!-- FORM -->
      <div class="box">
        <h2>Thông tin danh mục</h2>

        <input type="hidden" id="categoryId" />

        <label>Tên danh mục</label>
        <input
  type="text"
  id="categoryName"
  placeholder="Nhập tên danh mục"
  maxlength="100"
/>

        <label>Mô tả</label>
        <textarea
  id="categoryDescription"
  placeholder="Nhập mô tả danh mục"
  maxlength="500"
></textarea>

<p id="thongBao" style="margin-top: 5px; font-weight: bold;"></p>

        <button class="btn-save" onclick="luuDanhMuc()">Lưu</button>
        <button class="btn-reset" onclick="lamMoi()">Làm mới</button>
      </div>

      <!-- TÌM KIẾM -->
      <div class="box">
        <h2>Tìm kiếm danh mục</h2>

        <input
          type="text"
          id="timKiem"
          class="tim-kiem"
          placeholder="Nhập tên danh mục cần tìm..."
          oninput="timKiemDanhMuc()"
        />

        <!-- BẢNG -->
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên danh mục</th>
              <th>Mô tả</th>
              <th>Thao tác</th>
            </tr>
          </thead>

          <tbody id="danhSachDanhMuc"></tbody>
        </table>
      </div>
    </div>

    <script src="../js/quanlydanhmuc.js"></script>
  </body>
</html>
